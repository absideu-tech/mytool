name: Build EXE

on:
  workflow_dispatch:
    inputs:
      filename:
        description: '변환할 파이썬 파일명 (확장자 포함)'
        required: true
        default: 'main.py'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 빌드 도구 설치
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: EXE 파일 빌드
      run: |
        pyinstaller --onefile --noconsole ${{ github.event.inputs.filename }}

    - name: 결과물 업로드
      uses: actions/upload-artifact@v4
      with:
        name: build-result
        path: dist/*.exe