name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 빌드 도구 설치
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: EXE 파일 빌드
      run: |
        pyinstaller --onefile --noconsole time2.py
        # 콘솔창(검은 창)이 떠야 하는 프로그램이라면 위 줄의 --noconsole 을 지우세요.

    - name: 결과물 업로드
      uses: actions/upload-artifact@v4
      with:
        name: my-windows-app
        path: dist/*.exe
